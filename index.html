<!doctype html>
<!--
  SHATTERPOINT - the document shell.

  `data-preset` and `data-accent` are seeded here rather than left to main.ts on purpose.
  The tier is not known until an adapter has been probed and the WebGPU device has booted,
  which is hundreds of milliseconds after first paint; without a seed, the boot veil would
  render with no preset at all and then jump. `desktop-high` is the seed because it is the
  middle of the ladder, so the correction after main.ts resolves the real tier is at worst
  one notch in either direction instead of a full-range snap.

  There is not one style attribute in this file, and there must never be one: every rule
  the shell needs is in src/styles/app.css, which means the boot veil, the canvas and the
  overlay all obey the same tokens and the same preset collapse as the rest of the game.
-->
<html lang="en" data-preset="desktop-high" data-accent="ice">
  <head>
    <meta charset="utf-8" />

    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) return anything but zero, and
      those insets are the entire reason the HUD clears a notch. Zoom is pinned because a
      pinch during play is an aim gesture, not a request to magnify the page.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Matches --void-000 and the PWA manifest's theme_color, so the browser chrome, the
         splash and the canvas clear colour are one unbroken surface. -->
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />

    <title>SHATTERPOINT</title>
    <meta name="description" content="A first-person on-rails runner through corridors of breaking glass." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Favicons. The SVG is the primary: it is the master, it scales, and it is the only one
      that stays crisp on a 4x tab strip. The 32px PNG is the fallback for browsers that
      still ignore SVG favicons. apple-touch-icon must be the PLATED variant and a PNG -
      iOS neither rounds an SVG favicon nor applies a maskable mask, so it needs art that
      already has its own plate.
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />

    <!--
      Three roles, three families. Preconnect to both hosts because the stylesheet and the
      font binaries come from different origins and the second connection would otherwise
      not start until the first response had been parsed.

      display=swap, not block: the fallback stacks in tokens.css are metric-similar enough
      that a swap is a barely visible reflow, whereas a block would leave the boot veil's
      wordmark invisible while the game is already initialising. The game is fully playable
      with the fallback stack alone, which is what makes it safe to fail offline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Sora:wght@400;600;800&display=swap"
    />
  </head>

  <body>
    <div id="app">
      <!--
        No width/height attributes: the backing store is sized by the renderer from the
        tier's render scale and is deliberately NOT the element's CSS size. Setting either
        here would be overwritten on the first resize and would mislead anyone reading it.
      -->
      <canvas id="stage" aria-label="Game viewport" role="img"></canvas>

      <!--
        The screen-space half of the post chain. These four layers are composited by the
        browser rather than resampled by the render graph, which is why they are markup and
        not TSL nodes; src/styles/app.css explains the split and each [data-preset] block
        shows exactly which of them survive on which tier.

        Their position in this file is their position on screen: the container carries no
        z-index at all (app.css explains why - a stacking context there would sever the
        blend from the canvas), so paint order is DOM order, and the overlay below wins by
        its own z-index. That leaves the vignette and the grain treating the rendered image
        as film while the instrument cluster on top of them stays untouched - a HUD readout
        dimmed by its own vignette is a readout the player has to squint at.
      -->
      <div class="fx" aria-hidden="true">
        <div class="fx__layer fx__vignette"></div>
        <div class="fx__layer fx__aberration"></div>
        <div class="fx__layer fx__scanlines"></div>
        <div class="fx__layer fx__grain"></div>
      </div>

      <!-- ui/Overlay.ts builds its layer stack inside this node. -->
      <div id="overlay"></div>

      <div id="boot" class="boot">
        <!-- ICON:BEGIN generated by tools/icon-variants.mjs - do not edit by hand -->
        <svg class="boot__icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 1024 1024">
        <!--
          SHATTERPOINT - app icon. The fracture spells S J: hidden at a glance,
          legible once you look at it.
        
          The craft note that matters most: a crack in glass is not a white line. It is a
          DARK FISSURE with BRIGHT LIPS, because light catches the two fracture walls and
          the gap between them stays dark. Every earlier attempt here drew white strokes
          and that is why they read as drawn-on rather than broken. Each run below is
          painted in four passes - cyan bleed, dark fissure, lit lip offset up-left
          toward the key, faint counter-lip down-right from the fill light.
        
          Depth comes from: a slab back face offset behind the front face so the glass
          has thickness, ambient occlusion pooled inside the hull edge, a bevelled plate
          with a bright top-left inset and a dark bottom-right one, and a glossy sheen
          sweep. Two lights, not one - cool key upper-left, violet fill lower-right - so
          the form is carried by hue as well as value.
        
          Letter runs are the widest band, because the brief is "visible if you look".
          Distractors are routed clear of both letter cores rather than across them.
        -->
        <defs>
          <clipPath id="bi-plate"><rect width="1024" height="1024" rx="228" ry="228"/></clipPath>
        
          <!-- hull, reused for clipping the AO and the internal facets -->
          <clipPath id="bi-hullClip">
            <polygon points="418,150 776,254 866,566 668,876 336,844 172,552 236,296"/>
          </clipPath>
        
          <radialGradient id="bi-plateGround" cx="34%" cy="20%" r="96%">
            <stop offset="0"   stop-color="#1c4a66"/>
            <stop offset=".34" stop-color="#0d2438"/>
            <stop offset=".68" stop-color="#0a1024"/>
            <stop offset="1"   stop-color="#04040c"/>
          </radialGradient>
        
          <radialGradient id="bi-violetFill" cx="78%" cy="86%" r="60%">
            <stop offset="0"   stop-color="#7b4ad6" stop-opacity=".34"/>
            <stop offset="1"   stop-color="#7b4ad6" stop-opacity="0"/>
          </radialGradient>
        
          <radialGradient id="bi-keyPool" cx="46%" cy="30%" r="52%">
            <stop offset="0"   stop-color="#8ff0ff" stop-opacity=".5"/>
            <stop offset="1"   stop-color="#8ff0ff" stop-opacity="0"/>
          </radialGradient>
        
          <!-- front face of the slab -->
          <linearGradient id="bi-faceMain" x1=".06" y1="0" x2=".9" y2="1">
            <stop offset="0"   stop-color="#f4feff" stop-opacity=".95"/>
            <stop offset=".22" stop-color="#b6e8f8" stop-opacity=".85"/>
            <stop offset=".52" stop-color="#4e9cbe" stop-opacity=".72"/>
            <stop offset=".8"  stop-color="#1d4f70" stop-opacity=".78"/>
            <stop offset="1"   stop-color="#0b2138" stop-opacity=".9"/>
          </linearGradient>
        
          <!-- facet planes, each a distinct value so the body reads as cut glass -->
          <linearGradient id="bi-facetTop" x1=".2" y1="0" x2=".8" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
            <stop offset="1" stop-color="#8fd8ee" stop-opacity=".08"/>
          </linearGradient>
          <linearGradient id="bi-facetRight" x1="1" y1=".1" x2="0" y2="1">
            <stop offset="0" stop-color="#a97cf0" stop-opacity=".26"/>
            <stop offset="1" stop-color="#0a2130" stop-opacity=".34"/>
          </linearGradient>
          <linearGradient id="bi-facetLow" x1=".5" y1="1" x2=".5" y2="0">
            <stop offset="0" stop-color="#03101c" stop-opacity=".6"/>
            <stop offset="1" stop-color="#2f7ea0" stop-opacity=".18"/>
          </linearGradient>
        
          <!-- the slab's side, seen because the front face is offset off it -->
          <linearGradient id="bi-slabSide" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1a5c7d"/>
            <stop offset="1" stop-color="#04121e"/>
          </linearGradient>
        
          <linearGradient id="bi-chip" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#e8fbff" stop-opacity=".92"/>
            <stop offset=".55" stop-color="#5aa8c8" stop-opacity=".6"/>
            <stop offset="1"   stop-color="#06161f" stop-opacity=".9"/>
          </linearGradient>
        
          <linearGradient id="bi-sheen" x1=".1" y1="0" x2=".7" y2="1">
            <stop offset="0"   stop-color="#ffffff" stop-opacity=".2"/>
            <stop offset=".45" stop-color="#ffffff" stop-opacity=".05"/>
            <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
        
          <linearGradient id="bi-bevelHi" x1="0" y1="0" x2=".6" y2="1">
            <stop offset="0"   stop-color="#c8f4ff" stop-opacity=".85"/>
            <stop offset=".55" stop-color="#c8f4ff" stop-opacity=".12"/>
            <stop offset="1"   stop-color="#c8f4ff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="bi-bevelLo" x1="1" y1="1" x2=".3" y2="0">
            <stop offset="0"   stop-color="#000000" stop-opacity=".75"/>
            <stop offset=".5"  stop-color="#000000" stop-opacity=".18"/>
            <stop offset="1"   stop-color="#000000" stop-opacity="0"/>
          </linearGradient>
        
          
          <filter id="bi-crackBleed" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="7"/>
          </filter>
          <filter id="bi-aoBlur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="16"/>
          </filter>
          <filter id="bi-coreBurst" x="-140%" y="-140%" width="380%" height="380%">
            <feGaussianBlur stdDeviation="22"/>
          </filter>
          
        
          <!-- ============ THE FRACTURE NETWORK ============
               Band A: the two letterforms, widest, radiating from the strike.
               Band B: mid-distance runs, routed clear of the letter cores.
               Band C: fine runs reaching the hull. -->
        
          <g id="bi-letters" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
            <!-- S: top bar, shoulder, waist diagonal, lower bowl, bottom bar. One gap,
                 at the shoulder, where closure repairs it most willingly. -->
            <path d="M596 288 L 520 338 L 438 306 L 352 330 L 332 388"/>
            <path d="M346 424 L 372 438 L 452 474 L 498 528 L 494 592 L 446 636 L 366 650 L 312 620"/>
            <!-- J: flag, stem, hook. One gap, mid stem. -->
            <path d="M614 284 L 676 306 L 752 320 L 748 466"/>
            <path d="M744 506 L 738 566 L 712 628 L 652 656 L 600 630 L 592 588"/>
          </g>
        
          <g id="bi-midRuns" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
            <path d="M604 306 L 592 392 L 556 452"/>
            <path d="M332 388 L 262 372"/>
            <path d="M748 466 L 812 448"/>
            <path d="M446 636 L 424 704"/>
            <path d="M652 656 L 668 722"/>
            <path d="M556 452 L 540 520 L 566 566"/>
          </g>
        
          <g id="bi-fineRuns" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
            <path d="M262 372 L 190 400"/>
            <path d="M352 330 L 312 268 L 258 212"/>
            <path d="M676 306 L 644 258 L 618 190"/>
            <path d="M812 448 L 862 466"/>
            <path d="M738 566 L 798 596 L 844 660"/>
            <path d="M424 704 L 396 796 L 384 846"/>
            <path d="M668 722 L 690 814"/>
            <path d="M312 620 L 236 596 L 196 566"/>
            <!-- lower-left was a blank quadrant; these carry the network into it -->
            <path d="M366 650 L 344 726 L 312 812"/>
            <path d="M446 636 L 470 712 L 462 800 L 466 856"/>
            <path d="M344 726 L 262 744"/>
            <path d="M592 588 L 552 552"/>
            <path d="M596 288 L 588 186"/>
          </g>
        </defs>
        
        <g clip-path="url(#bi-plate)">
        
          <!-- ============ PLATE ============ -->
          <rect width="1024" height="1024" fill="url(#bi-plateGround)"/>
          <rect width="1024" height="1024" fill="url(#bi-violetFill)"/>
          <rect width="1024" height="1024" fill="url(#bi-keyPool)"/>
        
          <!-- suspended chips, small, off-axis -->
          <g fill="#8fdcf5" opacity=".22">
            <polygon points="180,318 224,296 214,340 186,352"/>
            <polygon points="856,352 896,336 886,378 862,386"/>
            <polygon points="240,772 284,792 258,816 236,800"/>
            <polygon points="146,540 180,522 176,562 152,566"/>
          </g>
        
          <g transform="rotate(-7 512 512)">
        
            <!-- bloom behind the slab -->
        
            <!-- SLAB SIDE: the same hull offset, so the front face sits on thickness -->
            <polygon fill="url(#bi-slabSide)" transform="translate(11 15)"
              points="418,150 776,254 866,566 668,876 336,844 172,552 236,296"/>
        
            <!-- FRONT FACE -->
            <polygon fill="url(#bi-faceMain)"
              points="418,150 776,254 866,566 668,876 336,844 172,552 236,296"/>
        
            <g clip-path="url(#bi-hullClip)">
              <!-- facet planes -->
              <polygon fill="url(#bi-facetTop)"   points="418,150 776,254 512,512 236,296"/>
              <polygon fill="url(#bi-facetRight)" points="776,254 866,566 668,876 512,512"/>
              <polygon fill="url(#bi-facetLow)"   points="336,844 172,552 512,512"/>
              <polygon fill="#0a2431" opacity=".2" points="172,552 236,296 512,512"/>
        
              <!-- facet seams, finer than any crack so the two never confuse -->
              <g stroke="#a8e4f6" stroke-width="3" stroke-opacity=".3" fill="none">
                <path d="M418 150 L 512 512 L 776 254"/>
                <path d="M172 552 L 512 512 L 336 844"/>
                <path d="M512 512 L 866 566"/>
                <path d="M236 296 L 512 512"/>
              </g>
        
              <!-- ambient occlusion pooled inside the hull edge -->
              <polygon fill="none" stroke="#020a12" stroke-width="38" stroke-opacity=".4"
                filter="url(#bi-aoBlur)"
                points="418,150 776,254 866,566 668,876 336,844 172,552 236,296"/>
        
              <!-- glossy sheen sweep, upper-left, the app-icon gloss -->
              <path fill="url(#bi-sheen)" d="M170 150 L 700 150 L 300 700 L 170 640 Z"/>
            </g>
        
            <!-- hull edges: bright where the key hits, dark on the fill side -->
            <polyline fill="none" stroke="#e8fdff" stroke-width="9" stroke-opacity=".9" stroke-linejoin="round"
              points="336,844 172,552 236,296 418,150 776,254"/>
            <polyline fill="none" stroke="#7fd0ea" stroke-width="8" stroke-opacity=".45" stroke-linejoin="round"
              points="776,254 866,566 668,876 336,844"/>
        
            <!-- voids: pieces gone, in the hull corners, clear of both letters -->
            <g fill="#01050a">
              <polygon points="238,306 302,272 288,340 226,356"/>
              <polygon points="642,742 700,756 676,798 640,784"/>
            </g>
            <g fill="none" stroke="#bff0ff" stroke-width="5" stroke-opacity=".8">
              <polygon points="238,306 302,272 288,340 226,356"/>
              <polygon points="642,742 700,756 676,798 640,784"/>
            </g>
        
            <!-- ============ CRACKS, FOUR PASSES PER BAND ============
                 1 cyan bleed  2 dark fissure  3 lit lip toward the key (up-left)
                 4 faint counter-lip from the violet fill (down-right)              -->
            <g clip-path="url(#bi-hullClip)">
              <!-- 1 bleed -->
              <use href="#bi-letters"  stroke="#6ee7ff" stroke-width="26" opacity=".42" filter="url(#bi-crackBleed)"/>
              <use href="#bi-midRuns"  stroke="#6ee7ff" stroke-width="17" opacity=".34" filter="url(#bi-crackBleed)"/>
              <use href="#bi-fineRuns" stroke="#6ee7ff" stroke-width="11" opacity=".24" filter="url(#bi-crackBleed)"/>
        
              <!-- 2 fissure -->
              <use href="#bi-letters"  stroke="#020a12" stroke-width="15" opacity=".92"/>
              <use href="#bi-midRuns"  stroke="#020a12" stroke-width="10" opacity=".88"/>
              <use href="#bi-fineRuns" stroke="#020a12" stroke-width="6.5" opacity=".82"/>
        
              <!-- 3 lit lip -->
              <g transform="translate(-3 -3.4)">
                <use href="#bi-letters"  stroke="#ffffff" stroke-width="6"   opacity=".97"/>
                <use href="#bi-midRuns"  stroke="#f0fcff" stroke-width="4"   opacity=".9"/>
                <use href="#bi-fineRuns" stroke="#d6f4ff" stroke-width="2.6" opacity=".82"/>
              </g>
        
              <!-- 4 counter-lip -->
              <g transform="translate(2.6 3)">
                <use href="#bi-letters"  stroke="#b98cf5" stroke-width="3.4" opacity=".5"/>
                <use href="#bi-midRuns"  stroke="#b98cf5" stroke-width="2.4" opacity=".38"/>
              </g>
            </g>
        
            <!-- ============ STRIKE ============ -->
            <circle cx="604" cy="286" r="130" fill="#6ee7ff" opacity=".26" filter="url(#bi-coreBurst)"/>
            <!-- irregular flare. Concentric rings plus four even rays read as a
                 targeting reticle, which is UI, not damage. -->
            <polygon fill="#ffffff" opacity=".95" points="592,268 618,276 622,300 596,308 582,288"/>
            <g stroke="#ffffff" stroke-width="3" stroke-linecap="butt" opacity=".55">
              <path d="M604 250 L 606 268"/><path d="M628 292 L 650 296"/>
            </g>
        
            <!-- detached chips, with their own edge light -->
            <g stroke="#d6f6ff" stroke-width="6" stroke-linejoin="round">
              <polygon fill="url(#bi-chip)" points="752,700 830,740 786,788 756,744"/>
              <polygon fill="url(#bi-chip)" opacity=".8" points="886,596 938,624 906,660 884,634"/>
            </g>
          </g>
        
          <!-- ============ PLATE BEVEL, painted last ============ -->
          <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bi-bevelLo)"
                style="mix-blend-mode:multiply" opacity=".9"/>
          <rect x="7" y="7" width="1010" height="1010" rx="222" fill="none"
                stroke="url(#bi-bevelHi)" stroke-width="10"/>
          <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none"
                stroke="#04040c" stroke-width="5" stroke-opacity=".7"/>
        </g>
        </svg>
        
        <!-- ICON:END -->
        <p class="boot__word t-display">SHATTERPOINT</p>
        <div class="boot__bar" role="presentation"></div>
        <p class="boot__status t-ui" id="boot-status" role="status" aria-live="polite">Starting up</p>
      </div>

      <noscript>
        <div class="noscript">
          <p class="t-display">SHATTERPOINT</p>
          <p class="t-ui">This game runs entirely in your browser and needs JavaScript enabled.</p>
        </div>
      </noscript>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
